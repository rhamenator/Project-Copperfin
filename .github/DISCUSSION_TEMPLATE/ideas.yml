title: "[idea] <short summary>"
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new feature or capability? Share it here first —
        Ideas discussions are for open-ended proposals. Once an idea has
        enough shape, a maintainer can turn it into a tracked issue.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing or painful today? Who runs into this?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed idea
      description: What would you like to see? Sketch the behavior, API, or workflow if you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or prior art (including how VFP9 itself handles this, if relevant).
    validations:
      required: false

  - type: textarea
    id: roadmap
    attributes:
      label: Related roadmap area (optional)
      description: If you've looked at docs/05-roadmap.md, which workstream does this fit under?
    validations:
      required: false
