name: Traceability Slice (Issue-Only)
description: Use for prompt-sized implementation slices with requirement/verification evidence.
title: "[slice] <lane> - <short behavior target>"
labels:
  - traceability
  - slice
body:
  - type: markdown
    attributes:
      value: |
        Use this template when shipping code via issues without a pull request.
        Keep requirement and verification IDs stable after publishing.

  - type: input
    id: parent_lane
    attributes:
      label: Parent Lane / Family
      description: "Examples: #92, #13, #15, #19, #22, #30, #33"
      placeholder: "#92"
    validations:
      required: true

  - type: input
    id: requirement_ids
    attributes:
      label: Governing Requirement IDs
      description: "List existing product/recovered/derived RQ-* or LLR-* IDs. If none is evidenced yet, enter GAP-<scope>-<short-name> and explain below; do not derive a requirement from current code."
      placeholder: "RQ-A3-150-retry-restores-session-state, LLR-VFP-NUM-001"
    validations:
      required: true

  - type: input
    id: parent_requirement_ids
    attributes:
      label: Parent Requirement / Hazard IDs
      description: "For derived requirements, name the parent RQ-*/LLR-* or HZ-* constraint. Enter N/A only when the requirement is not derived."
      placeholder: "RQ-CF-RUNTIME-001, HZ-runtime-crash-01"
    validations:
      required: true

  - type: input
    id: verification_ids
    attributes:
      label: Verification IDs (VR-*)
      description: "Format: VR-<lane>-<issue>-<short-name>; one per verification objective."
      placeholder: "VR-A3-150-retry-restores-work-areas, VR-A3-150-retry-loop-completes"
    validations:
      required: true

  - type: input
    id: documentation_traceability
    attributes:
      label: Documentation Traceability (If Docs Changed)
      description: "Provide DQ-*, DV-*, and HZ-* ids. HZ ids must resolve in docs/safety/hazard-register.md. Use N/A if no docs changed."
      placeholder: "DQ-runtime-2201-fault-recovery, DV-runtime-2201-walkthrough, HZ-runtime-debug-01"
    validations:
      required: true

  - type: dropdown
    id: source_of_truth
    attributes:
      label: Allowed Requirement Source
      description: "Select all evidenced sources. For a GAP-* with no allowed source evidence, select only the unresolved-gap option and explain the missing evidence below."
      multiple: true
      options:
        - Real installed VFP9 observation
        - Shipped Microsoft/VFP documentation
        - Explicit repository-owner product policy
        - Registered known-bug or crash exception
        - Derived from identified parent requirement or hazard
        - Unresolved recovery gap - no allowed source evidence yet
    validations:
      required: true

  - type: textarea
    id: behavior_statement
    attributes:
      label: Requirement Statement
      description: "State the required behavior in testable terms."
      placeholder: "When RETRY is executed after a runtime fault, the current data session state is restored before control resumes."
    validations:
      required: true

  - type: textarea
    id: source_evidence
    attributes:
      label: Source Evidence Or Recovery Gap
      description: "Cite the allowed evidence precisely. If a GAP-* ID was used, state what allowed evidence is missing or contradictory. Existing Copperfin code/tests may be comparison evidence but never the requirement source."
      placeholder: "VFP9 SP2 Help topic <title/path/hash>, observed VFP9 procedure/result, owner policy section, KBX-* entry, or recovery gap."
    validations:
      required: true

  - type: textarea
    id: affected_components
    attributes:
      label: Affected Components
      description: "List expected files/modules."
      placeholder: |
        src/runtime/prg_engine.cpp
        src/runtime/prg_engine_helpers.cpp
        tests/test_prg_engine_control_flow.cpp
    validations:
      required: true

  - type: textarea
    id: architecture_and_reverse_links
    attributes:
      label: Architecture And Reverse Traceability
      description: "Identify architecture boundaries and how changed code/tests link back to the governing requirement."
      placeholder: |
        architecture: docs/02-architecture.md section ...
        code: src/... (RQ-... comment or stable matrix mapping)
        tests: tests/... (VR-... / requirement mapping)
    validations:
      required: true

  - type: textarea
    id: verification_plan
    attributes:
      label: Verification Plan
      description: "List focused tests, broader regression/platform validation, boundary or misuse cases, and retained evidence locations."
      placeholder: |
        - ctest --test-dir build -C Release --output-on-failure
        - build/Release/test_prg_engine_control_flow.exe
    validations:
      required: true

  - type: dropdown
    id: safety_security_impact
    attributes:
      label: Safety/Security Impact
      options:
        - none
        - low
        - medium
        - high
        - catastrophic
    validations:
      required: true

  - type: textarea
    id: hazard_boundary_rollback
    attributes:
      label: Hazard, Misuse, Boundary, And Rollback Analysis
      description: "Required for data integrity, containment, security/package trust, debugger/recovery, concurrency, external process, generated-code, safety-significant, or large-population reach. Otherwise enter N/A with rationale."
      placeholder: "HZ-* links; misuse and boundary cases; rollback/revocation plan; residual limitation."
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence (Fill During/After Implementation)
      description: "Record commit hashes, workflow run IDs, and artifact paths."
      placeholder: |
        commit: <hash>
        workflow: native-validation run <id>
        artifact: artifacts/runtime-smoke-validation/<path>
    validations:
      required: true

  - type: textarea
    id: closure_statement
    attributes:
      label: Closure Statement
      description: "Confirm bidirectional requirement/code/test/evidence links, broader verification, hazards/exceptions, and any unresolved recovery gaps or compatibility deltas."
      placeholder: "All requirement IDs map to code, focused/broader verification, and retained results; reverse links are recorded. No unresolved gap or intentional compatibility delta."
    validations:
      required: true
