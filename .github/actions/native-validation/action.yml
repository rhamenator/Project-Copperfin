name: Native CMake validation
description: Configure/build the native inventory and run the platform suite or a verified Windows test portion.

inputs:
  platform:
    description: Platform contract used to select single- or multi-config CMake commands.
    required: true
  build_jobs:
    description: Bounded Windows build concurrency (2 or 3). Non-Windows lanes retain their fixed two-job cap.
    required: false
    default: '2'
  metrics_directory:
    description: Repository-relative directory for Windows phase metrics.
    required: false
    default: artifacts/windows-native-validation-metrics
  windows_test_shard:
    description: One-based Windows test shard index; other platforms are unchanged.
    required: false
    default: '1'
  windows_test_shard_count:
    description: Windows test partition count (1 or 3); default retains the full suite.
    required: false
    default: '1'

runs:
  using: composite
  steps:
    - name: Initialize Windows validation metrics
      if: ${{ inputs.platform == 'windows' }}
      shell: pwsh
      run: |
        $buildJobs = '${{ inputs.build_jobs }}'
        if ($buildJobs -notin @('2', '3')) {
          throw "Hosted Windows native validation build_jobs must be 2 or 3."
        }
        $shardIndex = '${{ inputs.windows_test_shard }}'
        $shardCount = '${{ inputs.windows_test_shard_count }}'
        if ($shardIndex -notin @('1', '2', '3') -or $shardCount -notin @('1', '3') -or
            [int]$shardIndex -gt [int]$shardCount) {
          throw "Hosted Windows native validation shard index/count is invalid."
        }
        & ./scripts/measure-windows-validation.ps1 -Mode Initialize -MetricsDirectory '${{ inputs.metrics_directory }}'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: 10.0.x

    - name: Configure native build
      if: ${{ inputs.platform != 'windows' }}
      shell: bash
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOPPERFIN_BUILD_TESTS=ON

    - name: Configure native build
      if: ${{ inputs.platform == 'windows' }}
      shell: pwsh
      run: >-
        & ./scripts/measure-windows-validation.ps1
        -Mode Run
        -MetricsDirectory '${{ inputs.metrics_directory }}'
        -Name 'Configure native build'
        -Category configure
        -FilePath cmake
        -CommandArguments @('-S', '.', '-B', 'build', '-A', 'x64', '-DCOPPERFIN_BUILD_TESTS=ON')

    - name: Build native targets
      if: ${{ inputs.platform != 'windows' }}
      shell: bash
      run: cmake --build build --parallel 2

    - name: Build native targets
      if: ${{ inputs.platform == 'windows' }}
      shell: pwsh
      run: >-
        & ./scripts/measure-windows-validation.ps1
        -Mode Run
        -MetricsDirectory '${{ inputs.metrics_directory }}'
        -Name 'Build native targets'
        -Category native-compile
        -FilePath cmake
        -CommandArguments @('--build', 'build', '--config', 'Release', '--parallel', '${{ inputs.build_jobs }}')
        -BuildJobs ([int]'${{ inputs.build_jobs }}')
        -SampleResources

    - name: Build Windows Debug mixed-mode DECLARE fixture
      if: ${{ inputs.platform == 'windows' }}
      shell: pwsh
      run: >-
        & ./scripts/measure-windows-validation.ps1
        -Mode Run
        -MetricsDirectory '${{ inputs.metrics_directory }}'
        -Name 'Build Windows Debug mixed-mode DECLARE fixture'
        -Category native-compile
        -FilePath cmake
        -CommandArguments @('--build', 'build', '--config', 'Debug', '--target', 'copperfin_mixed_mode_declared_dll_fixture', '--parallel', '2')
        -BuildJobs 2
        -SampleResources

    - name: Run native test suite
      if: ${{ inputs.platform != 'windows' }}
      shell: bash
      run: ctest --test-dir build --output-on-failure --timeout 180 --parallel 2

    - name: Run native test suite
      if: ${{ inputs.platform == 'windows' }}
      shell: pwsh
      run: >-
        & ./scripts/run-windows-native-tests.ps1
        -MetricsDirectory '${{ inputs.metrics_directory }}'
        -ShardIndex ([int]'${{ inputs.windows_test_shard }}')
        -ShardCount ([int]'${{ inputs.windows_test_shard_count }}')

    - name: Run macOS SET POINT locale matrix
      if: ${{ inputs.platform == 'macos' }}
      shell: bash
      run: |
        for locale in C en_US.UTF-8 pt_BR.UTF-8 de_DE.UTF-8; do
          echo "Running SET POINT display targets with LC_ALL=$locale"
          LC_ALL="$locale" ctest \
            --test-dir build \
            --output-on-failure \
            --timeout 180 \
            -R '^(test_prg_engine_control_flow|test_prg_engine_string_math_functions)$'
        done

    - name: Finalize Windows validation metrics
      if: ${{ always() && inputs.platform == 'windows' }}
      shell: pwsh
      run: >-
        & ./scripts/measure-windows-validation.ps1
        -Mode Finalize
        -MetricsDirectory '${{ inputs.metrics_directory }}'
