name: macOS Native Validation

on:
  push:
    branches: [main]
    paths-ignore:
      - ".agent-channel/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
      - ".github/workflows/native-validation-linux.yml"
      - ".github/workflows/native-validation-windows.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".agent-channel/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
      - ".github/workflows/native-validation-linux.yml"
      - ".github/workflows/native-validation-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-macos-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-native-validation:
    name: macOS Clang
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run shared native validation
        uses: ./.github/actions/native-validation
        with:
          platform: macos

      - name: Run SET POINT locale matrix
        shell: bash
        run: |
          for locale in C en_US.UTF-8 pt_BR.UTF-8 de_DE.UTF-8; do
            echo "Running SET POINT display targets with LC_ALL=$locale"
            LC_ALL="$locale" ctest \
              --test-dir build \
              --output-on-failure \
              --timeout 180 \
              -R '^(test_prg_engine_control_flow|test_prg_engine_string_math_functions)$'
          done
