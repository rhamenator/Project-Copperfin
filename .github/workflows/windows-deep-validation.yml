name: Windows Deep Validation

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: Native and managed build configuration.
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
      build_jobs:
        description: Bounded native compile concurrency for measured Windows trials.
        required: true
        default: '2'
        type: choice
        options:
          - '2'
          - '3'
      test_jobs:
        description: Bounded native CTest concurrency.
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
      require_vfp9_samples:
        description: Fail closed unless the installed VFP9 sample corpus is available.
        required: true
        default: false
        type: boolean
      vfp9_root:
        description: Installed VFP9 root on the Windows runner.
        required: false
        default: 'C:\Program Files (x86)\Microsoft Visual FoxPro 9'
        type: string

permissions:
  contents: read

jobs:
  windows-deep-validation:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize Windows validation metrics
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Initialize
          -MetricsDirectory artifacts/windows-deep-validation-metrics

      - name: Check VFP9 sample prerequisite
        id: vfp9_samples
        shell: pwsh
        run: >-
          & ./scripts/check-windows-vfp9-samples.ps1
          -Root '${{ inputs.vfp9_root }}'
          -Require:$${{ inputs.require_vfp9_samples }}
          -OutputPath artifacts/windows-deep-validation-metrics/vfp9-sample-prerequisite.json

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Configure native build
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Run
          -MetricsDirectory artifacts/windows-deep-validation-metrics
          -Name 'Configure native build'
          -Category configure
          -FilePath cmake
          -CommandArguments @('-S', '.', '-B', 'build', '-A', 'x64', '-DCOPPERFIN_BUILD_TESTS=ON')

      - name: Build native binaries and tests
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Run
          -MetricsDirectory artifacts/windows-deep-validation-metrics
          -Name 'Build native binaries and tests'
          -Category native-compile
          -FilePath cmake
          -CommandArguments @('--build', 'build', '--config', '${{ inputs.build_configuration }}', '--parallel', '${{ inputs.build_jobs }}')
          -BuildJobs ([int]'${{ inputs.build_jobs }}')
          -SampleResources

      - name: Run native CTest suite
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Run
          -MetricsDirectory artifacts/windows-deep-validation-metrics
          -Name 'Run native CTest suite'
          -Category native-test
          -FilePath ctest
          -CommandArguments @('--test-dir', 'build', '-C', '${{ inputs.build_configuration }}', '--output-on-failure', '--timeout', '180', '--parallel', '${{ inputs.test_jobs }}')
          -SampleResources

      - name: Build Visual Studio extension
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Run
          -MetricsDirectory artifacts/windows-deep-validation-metrics
          -Name 'Build Visual Studio extension'
          -Category managed-compile
          -FilePath msbuild
          -CommandArguments @('vsix/Copperfin.VisualStudio/Copperfin.VisualStudio.csproj', '/restore', '/t:Rebuild', '/p:Configuration=${{ inputs.build_configuration }}', '/p:DeployExtension=false')
          -SampleResources

      - name: Verify localized command resources
        shell: pwsh
        run: ./scripts/test-vsix-command-localization.ps1 -VsixPath vsix/Copperfin.VisualStudio/bin/${{ inputs.build_configuration }}/net472/Copperfin.VisualStudio.vsix

      - name: Run managed VSIX behavior tests
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Run
          -MetricsDirectory artifacts/windows-deep-validation-metrics
          -Name 'Run managed VSIX behavior tests'
          -Category managed-test
          -FilePath dotnet
          -CommandArguments @('run', '--project', 'vsix/Copperfin.LanguageServiceTests/Copperfin.StudioTargetSelectionTests.csproj', '--configuration', '${{ inputs.build_configuration }}')

      - name: Run managed language-service tests
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Run
          -MetricsDirectory artifacts/windows-deep-validation-metrics
          -Name 'Run managed language-service tests'
          -Category managed-test
          -FilePath dotnet
          -CommandArguments @('run', '--project', 'vsix/Copperfin.LanguageServiceTests/Copperfin.LanguageServiceTests.csproj', '--configuration', '${{ inputs.build_configuration }}')

      - name: Run .NET Framework process-runner tests
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Run
          -MetricsDirectory artifacts/windows-deep-validation-metrics
          -Name 'Run .NET Framework process-runner tests'
          -Category managed-test
          -FilePath dotnet
          -CommandArguments @('run', '--project', 'vsix/Copperfin.ProcessRunnerNetFrameworkTests/Copperfin.ProcessRunnerNetFrameworkTests.csproj', '--configuration', '${{ inputs.build_configuration }}')

      - name: Build standalone Studio shell
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Run
          -MetricsDirectory artifacts/windows-deep-validation-metrics
          -Name 'Build standalone Studio shell'
          -Category managed-compile
          -FilePath msbuild
          -CommandArguments @('vsix/Copperfin.Studio/Copperfin.Studio.csproj', '/restore', '/t:Rebuild', '/p:Configuration=${{ inputs.build_configuration }}')
          -SampleResources

      - name: Build designer smoke tests
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Run
          -MetricsDirectory artifacts/windows-deep-validation-metrics
          -Name 'Build designer smoke tests'
          -Category managed-compile
          -FilePath msbuild
          -CommandArguments @('vsix/Copperfin.DesignerSmokeTests/Copperfin.DesignerSmokeTests.csproj', '/restore', '/t:Rebuild', '/p:Configuration=${{ inputs.build_configuration }}')
          -SampleResources

      - name: Run designer smoke tests
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Run
          -MetricsDirectory artifacts/windows-deep-validation-metrics
          -Name 'Run designer smoke tests'
          -Category managed-test
          -FilePath pwsh
          -CommandArguments @('-NoProfile', '-File', './scripts/run-required-designer-smoke.ps1', '-ExecutablePath', 'vsix/Copperfin.DesignerSmokeTests/bin/${{ inputs.build_configuration }}/net472/Copperfin.DesignerSmokeTests.exe', '-TimeoutSeconds', '1800')
          -SampleResources

      - name: Run runtime package smoke test
        if: ${{ steps.vfp9_samples.outputs.available == 'true' }}
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Run
          -MetricsDirectory artifacts/windows-deep-validation-metrics
          -Name 'Run runtime package smoke test'
          -Category native-test
          -FilePath pwsh
          -CommandArguments @('-NoProfile', '-File', './scripts/run-windows-deep-smoke.ps1', '-Stage', 'RuntimePackage', '-BuildConfiguration', '${{ inputs.build_configuration }}')
          -SampleResources

      - name: Run PRG debugger smoke test
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Run
          -MetricsDirectory artifacts/windows-deep-validation-metrics
          -Name 'Run PRG debugger smoke test'
          -Category native-test
          -FilePath pwsh
          -CommandArguments @('-NoProfile', '-File', './scripts/run-windows-deep-smoke.ps1', '-Stage', 'PrgDebugger', '-BuildConfiguration', '${{ inputs.build_configuration }}')
          -SampleResources

      - name: Run xAsset bootstrap smoke test
        if: ${{ steps.vfp9_samples.outputs.available == 'true' }}
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Run
          -MetricsDirectory artifacts/windows-deep-validation-metrics
          -Name 'Run xAsset bootstrap smoke test'
          -Category native-test
          -FilePath pwsh
          -CommandArguments @('-NoProfile', '-File', './scripts/run-windows-deep-smoke.ps1', '-Stage', 'XAsset', '-BuildConfiguration', '${{ inputs.build_configuration }}')
          -SampleResources

      - name: Run report xAsset smoke test
        if: ${{ steps.vfp9_samples.outputs.available == 'true' }}
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Run
          -MetricsDirectory artifacts/windows-deep-validation-metrics
          -Name 'Run report xAsset smoke test'
          -Category native-test
          -FilePath pwsh
          -CommandArguments @('-NoProfile', '-File', './scripts/run-windows-deep-smoke.ps1', '-Stage', 'Report', '-BuildConfiguration', '${{ inputs.build_configuration }}')
          -SampleResources

      - name: Run menu xAsset smoke test
        if: ${{ steps.vfp9_samples.outputs.available == 'true' }}
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Run
          -MetricsDirectory artifacts/windows-deep-validation-metrics
          -Name 'Run menu xAsset smoke test'
          -Category native-test
          -FilePath pwsh
          -CommandArguments @('-NoProfile', '-File', './scripts/run-windows-deep-smoke.ps1', '-Stage', 'Menu', '-BuildConfiguration', '${{ inputs.build_configuration }}')
          -SampleResources

      - name: Finalize Windows validation metrics
        if: ${{ always() }}
        shell: pwsh
        run: >-
          & ./scripts/measure-windows-validation.ps1
          -Mode Finalize
          -MetricsDirectory artifacts/windows-deep-validation-metrics

      - name: Upload Windows deep validation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copperfin-windows-deep-validation-${{ inputs.build_configuration }}-build-${{ inputs.build_jobs }}-test-${{ inputs.test_jobs }}
          path: |
            artifacts/windows-deep-validation-metrics/*.json
            build/${{ inputs.build_configuration }}/*.exe
            vsix/Copperfin.VisualStudio/bin/${{ inputs.build_configuration }}/net472/*.vsix
            vsix/Copperfin.Studio/bin/${{ inputs.build_configuration }}/net472/*.exe
            vsix/Copperfin.DesignerSmokeTests/bin/${{ inputs.build_configuration }}/net472/*.exe
