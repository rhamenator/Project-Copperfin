name: Safety Traceability Gate

on:
  workflow_dispatch:
    inputs:
      issue_numbers:
        description: "Comma-separated issue numbers to validate (example: 2201,2202)"
        required: true
        type: string
      require_closed_issues:
        description: Require all validated issues to be closed
        required: true
        default: true
        type: boolean
      require_primary_hazards:
        description: "Require at least one primary hazard id per issue (data corruption/system failure/runtime crash)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: read

jobs:
  validate-safety-traceability:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate dispatch boundary contract
        run: cmake -DSOURCE_DIR="$env:GITHUB_WORKSPACE" -P tests/run_safety_traceability_workflow_contract_check.cmake

      - name: Run safety traceability validator
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBERS: ${{ inputs.issue_numbers }}
          REQUIRE_CLOSED_ISSUES: ${{ inputs.require_closed_issues }}
          REQUIRE_PRIMARY_HAZARDS: ${{ inputs.require_primary_hazards }}
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP "safety-traceability-report.json"
          .\scripts\validate-safety-traceability.ps1 `
            -Repository "${{ github.repository }}" `
            -IssueNumbers $env:ISSUE_NUMBERS `
            -RequireClosedIssues $env:REQUIRE_CLOSED_ISSUES `
            -RequirePrimaryHazardCoverage $env:REQUIRE_PRIMARY_HAZARDS `
            -ReportPath $reportPath

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safety-traceability-report
          path: ${{ runner.temp }}/safety-traceability-report.json
