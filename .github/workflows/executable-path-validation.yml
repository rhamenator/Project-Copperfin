name: Executable Path Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/executable-path-validation.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "apps/copperfin_build_host/**"
      - "apps/copperfin_inspect/**"
      - "apps/copperfin_runtime_host/**"
      - "include/**"
      - "resources/locales/**"
      - "src/**"
      - "tests/**"
  # v1-development requires both matrix job contexts on every pull request.
  # Keep the focused paths for auditability, with a final catch-all so a
  # skipped required context cannot block documentation-only work indefinitely.
  pull_request:
    paths:
      - ".github/workflows/executable-path-validation.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "apps/copperfin_build_host/**"
      - "apps/copperfin_inspect/**"
      - "apps/copperfin_runtime_host/**"
      - "include/**"
      - "resources/locales/**"
      - "src/**"
      - "tests/**"
      - "**"

permissions:
  contents: read

jobs:
  executable-paths:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            c: gcc
            cxx: g++
          - name: Clang
            c: clang
            cxx: clang++

    name: executable-paths-${{ matrix.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate focused workflow path filters
        run: cmake -P cmake/validate_focused_workflow_path_filters.cmake

      - name: Configure focused build
        run: >-
          cmake -S . -B build
          -DCOPPERFIN_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.c }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build executable path regressions
        run: >-
          cmake --build build --parallel 2 --target
          test_platform_environment
          test_localization
          test_licensing_status
          test_build_host_output
          test_runtime_host_implicit_path_launch
          test_tool_license_path_launch

      - name: Run executable path regressions
        run: >-
          ctest --test-dir build --output-on-failure
          -R "^(test_platform_environment|test_localization|test_licensing_status|test_build_host_output|test_runtime_host_implicit_path_launch|test_tool_license_path_launch)$"
