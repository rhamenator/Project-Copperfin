name: Audit Containment Validation

on:
  push:
    branches: [main, v1-development]
    paths:
      - ".github/workflows/audit-containment-validation.yml"
      - "apps/copperfin_runtime_host/**"
      - "include/copperfin/security/**"
      - "src/security/**"
      - "tests/test_runtime_host_audit_containment.cpp"
      - "tests/test_runtime_host_audit_containment_main.cpp"
      - "tests/test_runtime_host_audit_snapshots.cpp"
      - "tests/test_runtime_host_audit_package.cpp"
      - "tests/test_runtime_host_audit_contracts.cpp"
      - "tests/test_runtime_host_audit_main.cpp"
      - "tests/test_runtime_host_debug_output_support.h"
      - "tests/test_runtime_host_debug_output_formatting_xasset.cpp"
      - "tests/test_runtime_host_debug_output_formatting_bridge.cpp"
      - "tests/test_runtime_host_debug_output_formatting_contract.cpp"
      - "tests/test_runtime_host_debug_output_localization.cpp"
      - "tests/test_runtime_host_debug_output_formatting_main.cpp"
      - "tests/run_runtime_host_binding_check.cmake"
      - "tests/test_security_controls.cpp"
      - "cmake/validate_focused_workflow_path_filters.cmake"
      - "CMakeLists.txt"
      - "tests/CMakeLists.txt"
  pull_request:
    branches: [main, v1-development]
    paths:
      - ".github/workflows/audit-containment-validation.yml"
      - "apps/copperfin_runtime_host/**"
      - "include/copperfin/security/**"
      - "src/security/**"
      - "tests/test_runtime_host_audit_containment.cpp"
      - "tests/test_runtime_host_audit_containment_main.cpp"
      - "tests/test_runtime_host_audit_snapshots.cpp"
      - "tests/test_runtime_host_audit_package.cpp"
      - "tests/test_runtime_host_audit_contracts.cpp"
      - "tests/test_runtime_host_audit_main.cpp"
      - "tests/test_runtime_host_debug_output_support.h"
      - "tests/test_runtime_host_debug_output_formatting_xasset.cpp"
      - "tests/test_runtime_host_debug_output_formatting_bridge.cpp"
      - "tests/test_runtime_host_debug_output_formatting_contract.cpp"
      - "tests/test_runtime_host_debug_output_localization.cpp"
      - "tests/test_runtime_host_debug_output_formatting_main.cpp"
      - "tests/run_runtime_host_binding_check.cmake"
      - "tests/test_security_controls.cpp"
      - "cmake/validate_focused_workflow_path_filters.cmake"
      - "CMakeLists.txt"
      - "tests/CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-containment:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
          - name: macOS Clang
            os: macos-latest
          - name: Windows MSVC
            os: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure focused native build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOPPERFIN_BUILD_TESTS=ON

      - name: Build audit containment targets
        run: cmake --build build --config Release --target copperfin_runtime_host test_runtime_host_debug_output_formatting test_runtime_host_audit_stream test_runtime_host_audit_containment test_security_controls --parallel 2

      - name: Run audit containment tests
        run: ctest --test-dir build -C Release --output-on-failure -R "^(test_focused_workflow_path_filters|test_runtime_host_binding|test_runtime_host_debug_output_formatting|test_runtime_host_audit_stream|test_runtime_host_audit_containment|test_security_controls)$" -j 2
