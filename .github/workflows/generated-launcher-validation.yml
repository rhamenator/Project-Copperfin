name: Generated Launcher Validation

on:
  push:
    branches: [main, v1-development]
    paths:
      - ".github/workflows/generated-launcher-validation.yml"
      - "CMakeLists.txt"
      - "apps/copperfin_build_host/**"
      - "include/**"
      - "resources/locales/**"
      - "src/**"
      - "samples/polyglot-dotnet-candidate/**"
      - "tests/CMakeLists.txt"
      - "tests/CopperfinTestIsolation.cmake"
      - "tests/test_environment_support.h"
      - "tests/test_generated_launcher_process.cpp"
      - "tests/test_generated_launcher_posix_process.cpp"
      - "tests/test_polyglot_dotnet_candidate.cpp"
      - "tests/test_runtime_pipeline*.cpp"
      - "tests/test_runtime_pipeline*.h"
  pull_request:
    branches: [main, v1-development]
    paths:
      - ".github/workflows/generated-launcher-validation.yml"
      - "CMakeLists.txt"
      - "apps/copperfin_build_host/**"
      - "include/**"
      - "resources/locales/**"
      - "src/**"
      - "samples/polyglot-dotnet-candidate/**"
      - "tests/CMakeLists.txt"
      - "tests/CopperfinTestIsolation.cmake"
      - "tests/test_environment_support.h"
      - "tests/test_generated_launcher_process.cpp"
      - "tests/test_generated_launcher_posix_process.cpp"
      - "tests/test_polyglot_dotnet_candidate.cpp"
      - "tests/test_runtime_pipeline*.cpp"
      - "tests/test_runtime_pipeline*.h"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-generated-launcher:
    name: Windows generated launcher process
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Configure native build
        run: cmake -S . -B build -DCOPPERFIN_BUILD_TESTS=ON

      - name: Build generated-launcher and .NET candidate targets
        run: cmake --build build --config Release --target test_generated_launcher_process test_polyglot_dotnet_candidate copperfin_build_host --parallel 2

      - name: Run generated-launcher and .NET candidate tests
        run: ctest --test-dir build -C Release --output-on-failure -R "^(test_generated_launcher_process|test_polyglot_dotnet_candidate)$"

  posix-generated-launcher:
    name: ${{ matrix.os }} generated launcher process
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Configure native build
        run: cmake -S . -B build -DCOPPERFIN_BUILD_TESTS=ON

      - name: Build POSIX generated-launcher and .NET candidate targets
        run: cmake --build build --config Release --target test_generated_launcher_posix_process test_polyglot_dotnet_candidate --parallel 2

      - name: Run POSIX generated-launcher and .NET candidate tests
        run: ctest --test-dir build -C Release --output-on-failure -R "^(test_generated_launcher_posix_process|test_polyglot_dotnet_candidate)$"
