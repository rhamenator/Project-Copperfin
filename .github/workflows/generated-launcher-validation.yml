name: Generated Launcher Validation

on:
  push:
    branches: [main, v1-development]
    paths:
      - ".github/workflows/generated-launcher-validation.yml"
      - "CMakeLists.txt"
      - "apps/copperfin_build_host/**"
      - "apps/copperfin_mcp_host/**"
      - "apps/copperfin_runtime_host/**"
      - "include/**"
      - "resources/locales/**"
      - "src/**"
      - "samples/polyglot-dotnet-candidate/**"
      - "samples/polyglot-python-sidecar/**"
      - "samples/polyglot-r-sidecar/**"
      - "tests/CMakeLists.txt"
      - "tests/CopperfinTestIsolation.cmake"
      - "tests/test_environment_support.h"
      - "tests/test_generated_launcher_process.cpp"
      - "tests/test_generated_launcher_posix_process.cpp"
      - "tests/test_mcp_host.cpp"
      - "tests/test_mcp_host_stdio.cmake"
      - "tests/run_platform_path_boundary_contract_check.cmake"
      - "tests/run_platform_environment_boundary_contract_check.cmake"
      - "tests/run_platform_executable_path_boundary_contract_check.cmake"
      - "tests/run_platform_file_version_boundary_contract_check.cmake"
      - "tests/run_platform_code_page_boundary_contract_check.cmake"
      - "tests/run_platform_sqlite_api_boundary_contract_check.cmake"
      - "tests/run_portable_clr_host_boundary_contract_check.cmake"
      - "tests/run_native_declared_library_boundary_contract_check.cmake"
      - "tests/run_native_declared_call_boundary_contract_check.cmake"
      - "tests/run_printer_shell_boundary_contract_check.cmake"
      - "tests/run_native_platform_workflow_contract_check.cmake"
      - "tests/run_github_actions_contract_check.cmake"
      - "tests/test_platform_environment.cpp"
      - "tests/test_platform_path.cpp"
      - "tests/test_runtime_host_sqlite_federation.cpp"
      - "tests/test_sqlite_federation_connector.cpp"
      - "tests/test_polyglot_dotnet_candidate.cpp"
      - "tests/test_polyglot_python_sidecar.cpp"
      - "tests/test_polyglot_r_sidecar.cpp"
      - "tests/test_runtime_pipeline*.cpp"
      - "tests/test_runtime_pipeline*.h"
  pull_request:
    branches: [main, v1-development]
    paths:
      - ".github/workflows/generated-launcher-validation.yml"
      - "CMakeLists.txt"
      - "apps/copperfin_build_host/**"
      - "apps/copperfin_mcp_host/**"
      - "apps/copperfin_runtime_host/**"
      - "include/**"
      - "resources/locales/**"
      - "src/**"
      - "samples/polyglot-dotnet-candidate/**"
      - "samples/polyglot-python-sidecar/**"
      - "samples/polyglot-r-sidecar/**"
      - "tests/CMakeLists.txt"
      - "tests/CopperfinTestIsolation.cmake"
      - "tests/test_environment_support.h"
      - "tests/test_generated_launcher_process.cpp"
      - "tests/test_generated_launcher_posix_process.cpp"
      - "tests/test_mcp_host.cpp"
      - "tests/test_mcp_host_stdio.cmake"
      - "tests/run_platform_path_boundary_contract_check.cmake"
      - "tests/run_platform_environment_boundary_contract_check.cmake"
      - "tests/run_platform_executable_path_boundary_contract_check.cmake"
      - "tests/run_platform_file_version_boundary_contract_check.cmake"
      - "tests/run_platform_code_page_boundary_contract_check.cmake"
      - "tests/run_platform_sqlite_api_boundary_contract_check.cmake"
      - "tests/run_portable_clr_host_boundary_contract_check.cmake"
      - "tests/run_native_declared_library_boundary_contract_check.cmake"
      - "tests/run_native_declared_call_boundary_contract_check.cmake"
      - "tests/run_printer_shell_boundary_contract_check.cmake"
      - "tests/run_native_platform_workflow_contract_check.cmake"
      - "tests/run_github_actions_contract_check.cmake"
      - "tests/test_platform_environment.cpp"
      - "tests/test_platform_path.cpp"
      - "tests/test_runtime_host_sqlite_federation.cpp"
      - "tests/test_sqlite_federation_connector.cpp"
      - "tests/test_polyglot_dotnet_candidate.cpp"
      - "tests/test_polyglot_python_sidecar.cpp"
      - "tests/test_polyglot_r_sidecar.cpp"
      - "tests/test_runtime_pipeline*.cpp"
      - "tests/test_runtime_pipeline*.h"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-generated-launcher:
    name: Windows generated launcher process
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Setup R 4.6.1
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.6.1"
          rtools-version: "none"
          use-public-rspm: "false"

      - name: Configure native build
        run: cmake -S . -B build -DCOPPERFIN_BUILD_TESTS=ON -DCOPPERFIN_REQUIRE_SQLITE_CONNECTOR=ON

      - name: Build generated-launcher, portable-platform, polyglot, MCP, and SQLite federation targets
        run: cmake --build build --config Release --target test_generated_launcher_process test_platform_path test_platform_environment test_prg_engine_arrays test_prg_engine_locale_code_page test_polyglot_dotnet_candidate test_polyglot_python_sidecar test_polyglot_r_sidecar test_mcp_host copperfin_mcp_host copperfin_build_host test_sqlite_federation_connector test_runtime_host_sqlite_federation --parallel 2

      - name: Run generated-launcher, portable-platform, polyglot, MCP, and SQLite federation tests
        run: ctest --test-dir build -C Release --output-on-failure -R "^(test_generated_launcher_process|test_platform_path|test_platform_path_boundary_contract|test_platform_environment|test_platform_environment_boundary_contract|test_platform_executable_path_boundary_contract|test_platform_file_version_boundary_contract|test_platform_code_page_boundary_contract|test_platform_sqlite_api_boundary_contract|test_portable_clr_host_boundary_contract|test_native_declared_library_boundary_contract|test_native_declared_call_boundary_contract|test_printer_shell_boundary_contract|test_prg_engine_arrays|test_prg_engine_locale_code_page|test_native_platform_workflow_contract|test_github_actions_contract|test_polyglot_dotnet_candidate|test_polyglot_python_sidecar|test_polyglot_r_sidecar|test_mcp_host|test_mcp_host_stdio|test_sqlite_federation_connector|test_runtime_host_sqlite_federation)$"

  posix-generated-launcher:
    name: ${{ matrix.os }} generated launcher process
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Setup R 4.6.1
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.6.1"
          rtools-version: "none"
          use-public-rspm: "false"

      - name: Configure native build
        run: cmake -S . -B build -DCOPPERFIN_BUILD_TESTS=ON -DCOPPERFIN_REQUIRE_SQLITE_CONNECTOR=ON

      - name: Build POSIX generated-launcher, portable-platform, polyglot, MCP, and SQLite federation targets
        run: cmake --build build --config Release --target test_generated_launcher_posix_process test_platform_path test_platform_environment test_prg_engine_arrays test_prg_engine_locale_code_page test_polyglot_dotnet_candidate test_polyglot_python_sidecar test_polyglot_r_sidecar test_mcp_host copperfin_mcp_host test_sqlite_federation_connector test_runtime_host_sqlite_federation --parallel 2

      - name: Run POSIX generated-launcher, portable-platform, polyglot, MCP, and SQLite federation tests
        run: ctest --test-dir build -C Release --output-on-failure -R "^(test_generated_launcher_posix_process|test_platform_path|test_platform_path_boundary_contract|test_platform_environment|test_platform_environment_boundary_contract|test_platform_executable_path_boundary_contract|test_platform_file_version_boundary_contract|test_platform_code_page_boundary_contract|test_platform_sqlite_api_boundary_contract|test_portable_clr_host_boundary_contract|test_native_declared_library_boundary_contract|test_native_declared_call_boundary_contract|test_printer_shell_boundary_contract|test_prg_engine_arrays|test_prg_engine_locale_code_page|test_native_platform_workflow_contract|test_github_actions_contract|test_polyglot_dotnet_candidate|test_polyglot_python_sidecar|test_polyglot_r_sidecar|test_mcp_host|test_mcp_host_stdio|test_sqlite_federation_connector|test_runtime_host_sqlite_federation)$"
