name: Security Supply Chain Gate

on:
  push:
    branches: [main]
    paths-ignore:
      - ".agent-channel/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".agent-channel/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
  workflow_call:

jobs:
  cve-sbom-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate SBOM publication contract
        run: cmake -DSOURCE_DIR="$GITHUB_WORKSPACE" -P tests/run_security_supply_chain_workflow_contract_check.cmake

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          syft-version: v1.50.0
          upload-artifact: "false"
          upload-release-assets: "false"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sbom
          path: |
            sbom.cdx.json
            docs/contracts/release-license-metadata.json
            LICENSES/LicenseRef-Copperfin-Application-Runtime-Toolchain-Exception-1.0.txt
            THIRD_PARTY_NOTICES.md
          retention-days: 0
          if-no-files-found: error

      - name: Trivy vulnerability gate (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
