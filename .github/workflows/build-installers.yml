name: Build Standalone Installers

# Traceability: RQ-CF-REL-002; DQ-windows-installer-lifecycle-scope;
# DV-windows-installer-lifecycle-contract; HZ-system-failure-01;
# HZ-data-corruption-01; HZ-doc-command-01.

on:
  push:
    branches: [main]
    paths-ignore:
      - ".agent-channel/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".agent-channel/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # #6497: full history so the prior-version installer step below
          # can check out a genuinely older commit for upgrade-lifecycle
          # testing.
          fetch-depth: 0

      - name: Install NSIS
        shell: pwsh
        run: >-
          & ./scripts/install-pinned-nsis.ps1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Configure
        run: cmake -S . -B build -A x64 -DCOPPERFIN_BUILD_TESTS=OFF -DCOPPERFIN_REQUIRE_X64=ON

      - name: Verify package version contract
        run: cmake -DCOPPERFIN_SOURCE_DIR:PATH=${{ github.workspace }} -DCOPPERFIN_BINARY_DIR:PATH=${{ github.workspace }}/build -P tests/run_package_version_contract_check.cmake

      - name: Verify package documents
        run: cmake --build build --config Release --target copperfin_package_document_check

      - name: Build
        run: cmake --build build --config Release --target copperfin_studio_host copperfin_runtime_host copperfin_build_host copperfin_inspect copperfin_mcp_host --parallel 2

      - name: Build standalone Studio shell
        run: msbuild vsix/Copperfin.Studio/Copperfin.Studio.csproj /restore /t:Rebuild /m:2 /p:Configuration=Release

      - name: Verify standalone Studio install tree
        shell: pwsh
        run: |
          cmake -E remove_directory build/standalone-studio-install
          cmake -E make_directory build/standalone-studio-install
          cmake --install build --config Release --prefix build/standalone-studio-install
          cmake `
            -DBINARY_DIR=build `
            -DINSTALL_ROOT=build/standalone-studio-install `
            -P tests/run_studio_install_contract_check.cmake

      - name: Verify localized catalog install
        shell: pwsh
        run: cmake -DINSTALL_ROOT=build/standalone-studio-install -P tests/run_locale_catalog_install_contract_check.cmake

      - name: Package (NSIS and ZIP)
        run: |
          cmake -E remove_directory build/package
          cmake -E make_directory build/package
          cpack --config build/CPackConfig.cmake -B build/package -C Release -G "NSIS;ZIP"
          cmake -E remove_directory build/package/_CPack_Packages

      - name: Verify CPack artifacts
        run: >-
          cmake
          -DCOPPERFIN_ARTIFACT_DIR:PATH=build/package
          -DCOPPERFIN_VERSION_FILE:FILEPATH=build/CopperfinPackageVersion.txt
          -DCOPPERFIN_EXPECTED_ARTIFACT_SUFFIXES="Windows.exe;Windows.zip"
          -P tests/run_cpack_artifact_contract_check.cmake

      # #6497: there is no real prior Copperfin release to upgrade from yet.
      # This builds a genuinely older commit's source (not just a version
      # stamp on today's source) with a synthetic, differently-versioned
      # package stamp (COPPERFIN_PACKAGE_VERSION_OVERRIDE), purely so the
      # installer-lifecycle step below can exercise real upgrade mechanics
      # (state preservation, uninstall-registration replacement) now,
      # ahead of an actual release. This installer is never uploaded as a
      # release artifact and never runs run_package_version_contract_check.cmake
      # (which would, correctly, reject its CPack/VSIX-manifest mismatch --
      # irrelevant here since this build only needs to produce one working
      # NSIS installer, not a self-consistent release candidate). A
      # `git worktree` is used so the main checkout above is left
      # untouched.
      - name: Build synthetic prior-version installer for upgrade testing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $priorCommit = (git log --before="90 days ago" -n 1 --format=%H HEAD).Trim()
          if ([string]::IsNullOrEmpty($priorCommit)) {
            throw "No commit found at least 90 days before HEAD; cannot build a synthetic prior version."
          }
          Write-Host "Using $priorCommit as the synthetic prior version's source."
          git worktree add ../copperfin-prior-version $priorCommit
          Push-Location ../copperfin-prior-version
          try {
            cmake -S . -B build -A x64 -DCOPPERFIN_BUILD_TESTS=OFF -DCOPPERFIN_REQUIRE_X64=ON -DCOPPERFIN_PACKAGE_VERSION_OVERRIDE=0.0.1
            cmake --build build --config Release --target copperfin_studio_host copperfin_runtime_host copperfin_build_host copperfin_inspect copperfin_mcp_host --parallel 2
            msbuild vsix/Copperfin.Studio/Copperfin.Studio.csproj /restore /t:Rebuild /m:2 /p:Configuration=Release
            cmake -E remove_directory build/package
            cmake -E make_directory build/package
            cpack --config build/CPackConfig.cmake -B build/package -C Release -G NSIS
            cmake -E remove_directory build/package/_CPack_Packages
          }
          finally {
            Pop-Location
          }
          $priorInstaller = @(Get-ChildItem -LiteralPath ../copperfin-prior-version/build/package -Filter 'copperfin-*-Windows.exe' -File)
          if ($priorInstaller.Count -ne 1) {
            throw "Synthetic prior-version build produced $($priorInstaller.Count) Windows installers; expected exactly one."
          }
          $priorKey = (Get-Content -LiteralPath ../copperfin-prior-version/build/CopperfinPackageInstallRegistryKey.txt -Raw).Trim()
          "PRIOR_INSTALLER_PATH=$($priorInstaller[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PRIOR_UNINSTALL_REGISTRY_KEY=$priorKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Exercise Windows installer lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem -LiteralPath build/package -Filter 'copperfin-*-Windows.exe' -File)
          if ($installer.Count -ne 1) {
            throw "Windows installer lifecycle requires exactly one NSIS installer; found $($installer.Count)."
          }
          $installRoot = Join-Path $env:RUNNER_TEMP "copperfin-installer-lifecycle-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $uninstallRegistryKeyName = (Get-Content -LiteralPath build/CopperfinPackageInstallRegistryKey.txt -Raw).Trim()
          $lifecycleArguments = @(
            '-InstallerPath', $installer[0].FullName,
            '-BinaryDirectory', (Join-Path $env:GITHUB_WORKSPACE 'build'),
            '-InstallRoot', $installRoot,
            '-UninstallRegistryKeyName', $uninstallRegistryKeyName,
            '-EvidenceDirectory', (Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-installer-lifecycle')
          )
          if (-not [string]::IsNullOrEmpty($env:PRIOR_INSTALLER_PATH)) {
            $lifecycleArguments += @(
              '-PriorInstallerPath', $env:PRIOR_INSTALLER_PATH,
              '-PriorUninstallRegistryKeyName', $env:PRIOR_UNINSTALL_REGISTRY_KEY
            )
          }
          & ./scripts/test-windows-installer-lifecycle.ps1 @lifecycleArguments

      - name: Clean up synthetic prior-version worktree
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath ../copperfin-prior-version) {
            git worktree remove --force ../copperfin-prior-version
          }

      - name: Create exact Corresponding Source archive
        uses: ./.github/actions/create-release-source
        with:
          revision: ${{ github.sha }}

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copperfin-windows-installers
          path: |
            build/package/copperfin-*-Windows.exe
            build/package/copperfin-*-Windows.zip
            artifacts/windows-installer-lifecycle/windows-installer-lifecycle.json
            release-source/Project-Copperfin-source-${{ github.sha }}.zip
          if-no-files-found: error

  macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOPPERFIN_BUILD_TESTS=OFF

      - name: Verify package version contract
        run: cmake -DCOPPERFIN_SOURCE_DIR:PATH=${{ github.workspace }} -DCOPPERFIN_BINARY_DIR:PATH=${{ github.workspace }}/build -P tests/run_package_version_contract_check.cmake

      - name: Verify package documents
        run: cmake --build build --config Release --target copperfin_package_document_check

      - name: Build
        run: cmake --build build --target copperfin_studio_host copperfin_runtime_host copperfin_build_host copperfin_inspect copperfin_mcp_host

      - name: Verify localized catalog install
        run: |
          cmake -E remove_directory build/install
          cmake -E make_directory build/install
          cmake --install build --prefix build/install
          cmake -DINSTALL_ROOT=build/install -P tests/run_locale_catalog_install_contract_check.cmake

      - name: Package (productbuild and TGZ)
        run: |
          cmake -E remove_directory build/package
          cmake -E make_directory build/package
          cpack --config build/CPackConfig.cmake -B build/package -G "productbuild;TGZ"
          cmake -E remove_directory build/package/_CPack_Packages

      - name: Verify CPack artifacts
        run: >-
          cmake
          -DCOPPERFIN_ARTIFACT_DIR:PATH=build/package
          -DCOPPERFIN_VERSION_FILE:FILEPATH=build/CopperfinPackageVersion.txt
          -DCOPPERFIN_EXPECTED_ARTIFACT_SUFFIXES="Darwin.pkg;Darwin.tar.gz"
          -P tests/run_cpack_artifact_contract_check.cmake

      - name: Create exact Corresponding Source archive
        uses: ./.github/actions/create-release-source
        with:
          revision: ${{ github.sha }}

      - name: Upload macOS installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copperfin-macos-installers
          path: |
            build/package/copperfin-*-Darwin.pkg
            build/package/copperfin-*-Darwin.tar.gz
            release-source/Project-Copperfin-source-${{ github.sha }}.zip
          if-no-files-found: error

  linux-deb-rpm-installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install RPM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOPPERFIN_BUILD_TESTS=OFF

      - name: Verify package version contract
        run: cmake -DCOPPERFIN_SOURCE_DIR:PATH=${{ github.workspace }} -DCOPPERFIN_BINARY_DIR:PATH=${{ github.workspace }}/build -P tests/run_package_version_contract_check.cmake

      - name: Verify package documents
        run: cmake --build build --config Release --target copperfin_package_document_check

      - name: Build
        run: cmake --build build --target copperfin_studio_host copperfin_runtime_host copperfin_build_host copperfin_inspect copperfin_mcp_host

      - name: Verify localized catalog install
        run: |
          cmake -E remove_directory build/install
          cmake -E make_directory build/install
          cmake --install build --prefix build/install
          cmake -DINSTALL_ROOT=build/install -P tests/run_locale_catalog_install_contract_check.cmake

      - name: Package Debian, RedHat, and portable archives
        run: |
          cmake -E remove_directory build/package
          cmake -E make_directory build/package
          cpack --config build/CPackConfig.cmake -B build/package -G "DEB;RPM;TGZ"
          cmake -E remove_directory build/package/_CPack_Packages

      - name: Verify CPack artifacts
        run: >-
          cmake
          -DCOPPERFIN_ARTIFACT_DIR:PATH=build/package
          -DCOPPERFIN_VERSION_FILE:FILEPATH=build/CopperfinPackageVersion.txt
          -DCOPPERFIN_EXPECTED_ARTIFACT_SUFFIXES="Linux.deb;Linux.rpm;Linux.tar.gz"
          -P tests/run_cpack_artifact_contract_check.cmake

      - name: Create exact Corresponding Source archive
        uses: ./.github/actions/create-release-source
        with:
          revision: ${{ github.sha }}

      - name: Upload Linux installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copperfin-linux-installers
          path: |
            build/package/copperfin-*-Linux.deb
            build/package/copperfin-*-Linux.rpm
            build/package/copperfin-*-Linux.tar.gz
            release-source/Project-Copperfin-source-${{ github.sha }}.zip
          if-no-files-found: error
