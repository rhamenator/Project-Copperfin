name: Build Standalone Installers

# Traceability: RQ-CF-REL-002; DQ-windows-installer-lifecycle-scope;
# DV-windows-installer-lifecycle-contract; HZ-system-failure-01;
# HZ-data-corruption-01; HZ-doc-command-01.

on:
  push:
    branches: [main]
    paths-ignore:
      - ".agent-channel/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".agent-channel/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pinnedVersion = '3.12'
          $nsisRoot = 'C:\Program Files (x86)\NSIS'
          $makensis = Join-Path $nsisRoot 'makensis.exe'
          $nsisFallbackRoot = Join-Path $env:RUNNER_TEMP 'nsis-3.12'
          $nsisFallbackArchive = Join-Path $env:RUNNER_TEMP 'nsis-3.12.zip'
          $nsisFallbackUri = 'https://downloads.sourceforge.net/nsis/nsis-3.12.zip'
          $nsisFallbackSha256 = '56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f'

          # The checksum-pinned portable archive is the only path with a
          # supply-chain integrity check, so it is tried FIRST (primary),
          # not merely as a last-resort fallback after an unpinned ambient
          # runner-image binary or an unpinned Chocolatey install (#5433).
          $pinnedArchiveAvailable = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $nsisFallbackUri -OutFile $nsisFallbackArchive -MaximumRedirection 5
              $archiveHash = (Get-FileHash -LiteralPath $nsisFallbackArchive -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($archiveHash -ne $nsisFallbackSha256) {
                throw "NSIS archive SHA-256 mismatch: expected $nsisFallbackSha256, got $archiveHash."
              }

              Expand-Archive -LiteralPath $nsisFallbackArchive -DestinationPath $env:RUNNER_TEMP -Force
              $portableMakensis = Join-Path $nsisFallbackRoot 'makensis.exe'
              if (-not (Test-Path -LiteralPath $portableMakensis -PathType Leaf)) {
                throw "Portable NSIS archive did not provide $portableMakensis."
              }

              $makensis = $portableMakensis
              $nsisRoot = $nsisFallbackRoot
              $pinnedArchiveAvailable = $true
              break
            }
            catch {
              Write-Warning "Checksum-pinned portable NSIS acquisition attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -lt 3) {
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
          }

          if (-not $pinnedArchiveAvailable) {
            Write-Warning 'Checksum-pinned NSIS archive unavailable after 3 attempts; falling back to an ambient runner-image or Chocolatey install. That binary is still rejected below unless it reports the pinned NSIS version.'
            # $makensis / $nsisRoot already hold their initial values here
            # (this branch only runs when the pinned-archive loop above
            # never reassigned them), so no need to reset them.
            if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) {
              # Not version-pinned here deliberately: the exact-match check
              # below already fully gates which version is trusted to build
              # the installer, so pinning `choco install` itself to
              # $pinnedVersion would add no security value while making
              # this fallback brittle against Chocolatey's own version
              # string formatting (e.g. a suffixed "3.12.20240115"-style
              # package version would never equal the plain "3.12" that
              # -Version demands) -- turning a transient pinned-archive
              # outage into a guaranteed total failure instead of a real
              # fallback attempt.
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                & choco install nsis -y --no-progress --retry-count=3 --retry-delay=5
                $chocoExitCode = $LASTEXITCODE
                if ($chocoExitCode -ne 0) {
                  Write-Warning "Chocolatey NSIS install attempt $attempt exited with code $chocoExitCode."
                }

                if ((Test-Path -LiteralPath $makensis -PathType Leaf) -or $attempt -ge 3) {
                  break
                }
                Start-Sleep -Seconds (5 * $attempt)
              }
            }

            if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) {
              throw "NSIS installation did not provide makensis.exe at $makensis, and the checksum-pinned archive was unavailable."
            }
          }

          # Regardless of which path produced makensis.exe, verify it
          # reports EXACTLY the pinned NSIS version (anchored match, not a
          # substring or prefix) before it is trusted to build the
          # installer. This is the only check available for the
          # ambient/Chocolatey paths (no binary hash is known ahead of time
          # for those); the portable archive path above already carries its
          # own SHA-256 pin. Stderr is discarded (2>$null), not merged via
          # 2>&1: with $ErrorActionPreference = 'Stop' in scope, merging a
          # native command's stderr into the pipeline can turn even benign
          # stderr output into a script-terminating error before the
          # exit-code/version checks below ever run.
          $reportedVersion = ((& $makensis /VERSION 2>$null) | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS compiler verification failed with exit code $LASTEXITCODE."
          }
          if ($reportedVersion -notmatch "^v?$([Regex]::Escape($pinnedVersion))$") {
            throw "makensis.exe at $makensis reported version '$reportedVersion', expected the pinned version $pinnedVersion; refusing to build the installer with an unverified compiler."
          }

          $nsisRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Using makensis.exe at $makensis (version: $reportedVersion)"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Configure
        run: cmake -S . -B build -A x64 -DCOPPERFIN_BUILD_TESTS=OFF -DCOPPERFIN_REQUIRE_X64=ON

      - name: Verify package version contract
        run: cmake -DCOPPERFIN_SOURCE_DIR:PATH=${{ github.workspace }} -DCOPPERFIN_BINARY_DIR:PATH=${{ github.workspace }}/build -P tests/run_package_version_contract_check.cmake

      - name: Verify package documents
        run: cmake --build build --config Release --target copperfin_package_document_check

      - name: Build
        run: cmake --build build --config Release --target copperfin_studio_host copperfin_runtime_host copperfin_build_host copperfin_inspect copperfin_mcp_host --parallel 2

      - name: Build standalone Studio shell
        run: msbuild vsix/Copperfin.Studio/Copperfin.Studio.csproj /restore /t:Rebuild /m:2 /p:Configuration=Release

      - name: Verify standalone Studio install tree
        shell: pwsh
        run: |
          cmake -E remove_directory build/standalone-studio-install
          cmake -E make_directory build/standalone-studio-install
          cmake --install build --config Release --prefix build/standalone-studio-install
          cmake `
            -DBINARY_DIR=build `
            -DINSTALL_ROOT=build/standalone-studio-install `
            -P tests/run_studio_install_contract_check.cmake

      - name: Verify localized catalog install
        shell: pwsh
        run: cmake -DINSTALL_ROOT=build/standalone-studio-install -P tests/run_locale_catalog_install_contract_check.cmake

      - name: Package (NSIS and ZIP)
        run: |
          cmake -E remove_directory build/package
          cmake -E make_directory build/package
          cpack --config build/CPackConfig.cmake -B build/package -C Release -G "NSIS;ZIP"
          cmake -E remove_directory build/package/_CPack_Packages

      - name: Verify CPack artifacts
        run: >-
          cmake
          -DCOPPERFIN_ARTIFACT_DIR:PATH=build/package
          -DCOPPERFIN_VERSION_FILE:FILEPATH=build/CopperfinPackageVersion.txt
          -DCOPPERFIN_EXPECTED_ARTIFACT_SUFFIXES="Windows.exe;Windows.zip"
          -P tests/run_cpack_artifact_contract_check.cmake

      - name: Exercise Windows installer lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem -LiteralPath build/package -Filter 'copperfin-*-Windows.exe' -File)
          if ($installer.Count -ne 1) {
            throw "Windows installer lifecycle requires exactly one NSIS installer; found $($installer.Count)."
          }
          $installRoot = Join-Path $env:RUNNER_TEMP "copperfin-installer-lifecycle-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $uninstallRegistryKeyName = (Get-Content -LiteralPath build/CopperfinPackageInstallRegistryKey.txt -Raw).Trim()
          ./scripts/test-windows-installer-lifecycle.ps1 `
            -InstallerPath $installer[0].FullName `
            -BinaryDirectory (Join-Path $env:GITHUB_WORKSPACE 'build') `
            -InstallRoot $installRoot `
            -UninstallRegistryKeyName $uninstallRegistryKeyName `
            -EvidenceDirectory (Join-Path $env:GITHUB_WORKSPACE 'artifacts/windows-installer-lifecycle')

      - name: Create exact Corresponding Source archive
        uses: ./.github/actions/create-release-source
        with:
          revision: ${{ github.sha }}

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copperfin-windows-installers
          path: |
            build/package/copperfin-*-Windows.exe
            build/package/copperfin-*-Windows.zip
            artifacts/windows-installer-lifecycle/windows-installer-lifecycle.json
            release-source/Project-Copperfin-source-${{ github.sha }}.zip
          if-no-files-found: error

  macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOPPERFIN_BUILD_TESTS=OFF

      - name: Verify package version contract
        run: cmake -DCOPPERFIN_SOURCE_DIR:PATH=${{ github.workspace }} -DCOPPERFIN_BINARY_DIR:PATH=${{ github.workspace }}/build -P tests/run_package_version_contract_check.cmake

      - name: Verify package documents
        run: cmake --build build --config Release --target copperfin_package_document_check

      - name: Build
        run: cmake --build build --target copperfin_studio_host copperfin_runtime_host copperfin_build_host copperfin_inspect copperfin_mcp_host

      - name: Verify localized catalog install
        run: |
          cmake -E remove_directory build/install
          cmake -E make_directory build/install
          cmake --install build --prefix build/install
          cmake -DINSTALL_ROOT=build/install -P tests/run_locale_catalog_install_contract_check.cmake

      - name: Package (productbuild and TGZ)
        run: |
          cmake -E remove_directory build/package
          cmake -E make_directory build/package
          cpack --config build/CPackConfig.cmake -B build/package -G "productbuild;TGZ"
          cmake -E remove_directory build/package/_CPack_Packages

      - name: Verify CPack artifacts
        run: >-
          cmake
          -DCOPPERFIN_ARTIFACT_DIR:PATH=build/package
          -DCOPPERFIN_VERSION_FILE:FILEPATH=build/CopperfinPackageVersion.txt
          -DCOPPERFIN_EXPECTED_ARTIFACT_SUFFIXES="Darwin.pkg;Darwin.tar.gz"
          -P tests/run_cpack_artifact_contract_check.cmake

      - name: Create exact Corresponding Source archive
        uses: ./.github/actions/create-release-source
        with:
          revision: ${{ github.sha }}

      - name: Upload macOS installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copperfin-macos-installers
          path: |
            build/package/copperfin-*-Darwin.pkg
            build/package/copperfin-*-Darwin.tar.gz
            release-source/Project-Copperfin-source-${{ github.sha }}.zip
          if-no-files-found: error

  linux-deb-rpm-installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install RPM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOPPERFIN_BUILD_TESTS=OFF

      - name: Verify package version contract
        run: cmake -DCOPPERFIN_SOURCE_DIR:PATH=${{ github.workspace }} -DCOPPERFIN_BINARY_DIR:PATH=${{ github.workspace }}/build -P tests/run_package_version_contract_check.cmake

      - name: Verify package documents
        run: cmake --build build --config Release --target copperfin_package_document_check

      - name: Build
        run: cmake --build build --target copperfin_studio_host copperfin_runtime_host copperfin_build_host copperfin_inspect copperfin_mcp_host

      - name: Verify localized catalog install
        run: |
          cmake -E remove_directory build/install
          cmake -E make_directory build/install
          cmake --install build --prefix build/install
          cmake -DINSTALL_ROOT=build/install -P tests/run_locale_catalog_install_contract_check.cmake

      - name: Package Debian, RedHat, and portable archives
        run: |
          cmake -E remove_directory build/package
          cmake -E make_directory build/package
          cpack --config build/CPackConfig.cmake -B build/package -G "DEB;RPM;TGZ"
          cmake -E remove_directory build/package/_CPack_Packages

      - name: Verify CPack artifacts
        run: >-
          cmake
          -DCOPPERFIN_ARTIFACT_DIR:PATH=build/package
          -DCOPPERFIN_VERSION_FILE:FILEPATH=build/CopperfinPackageVersion.txt
          -DCOPPERFIN_EXPECTED_ARTIFACT_SUFFIXES="Linux.deb;Linux.rpm;Linux.tar.gz"
          -P tests/run_cpack_artifact_contract_check.cmake

      - name: Create exact Corresponding Source archive
        uses: ./.github/actions/create-release-source
        with:
          revision: ${{ github.sha }}

      - name: Upload Linux installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copperfin-linux-installers
          path: |
            build/package/copperfin-*-Linux.deb
            build/package/copperfin-*-Linux.rpm
            build/package/copperfin-*-Linux.tar.gz
            release-source/Project-Copperfin-source-${{ github.sha }}.zip
          if-no-files-found: error
