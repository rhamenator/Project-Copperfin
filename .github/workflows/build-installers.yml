name: Build Standalone Installers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Configure
        run: cmake -S . -B build -A x64 -DCOPPERFIN_BUILD_TESTS=OFF -DCOPPERFIN_REQUIRE_X64=ON

      - name: Verify package documents
        run: cmake --build build --config Release --target copperfin_package_document_check

      - name: Build
        run: cmake --build build --config Release --target copperfin_studio_host copperfin_runtime_host copperfin_build_host copperfin_inspect

      - name: Build standalone Studio shell
        run: msbuild vsix/Copperfin.Studio/Copperfin.Studio.csproj /restore /t:Rebuild /p:Configuration=Release

      - name: Verify standalone Studio install tree
        shell: pwsh
        run: |
          cmake -E remove_directory build/standalone-studio-install
          cmake -E make_directory build/standalone-studio-install
          cmake --install build --config Release --prefix build/standalone-studio-install
          cmake `
            -DBINARY_DIR=build `
            -DINSTALL_ROOT=build/standalone-studio-install `
            -P tests/run_studio_install_contract_check.cmake

      - name: Package (NSIS and ZIP)
        run: |
          cmake -E remove_directory build/package
          cmake -E make_directory build/package
          cpack --config build/CPackConfig.cmake -B build/package -C Release -G "NSIS;ZIP"
          cmake -E remove_directory build/package/_CPack_Packages

      - name: Verify CPack artifacts
        run: >-
          cmake
          -DARTIFACT_DIR=build/package
          -DEXPECTED_ARTIFACTS="copperfin-0.1.0-Windows.exe;copperfin-0.1.0-Windows.zip"
          -P tests/run_cpack_artifact_contract_check.cmake

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copperfin-windows-installers
          path: |
            build/package/copperfin-0.1.0-Windows.exe
            build/package/copperfin-0.1.0-Windows.zip
          if-no-files-found: error

  macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOPPERFIN_BUILD_TESTS=OFF

      - name: Verify package documents
        run: cmake --build build --config Release --target copperfin_package_document_check

      - name: Build
        run: cmake --build build --target copperfin_studio_host copperfin_runtime_host copperfin_build_host copperfin_inspect

      - name: Package (productbuild and TGZ)
        run: |
          cmake -E remove_directory build/package
          cmake -E make_directory build/package
          cpack --config build/CPackConfig.cmake -B build/package -G "productbuild;TGZ"
          cmake -E remove_directory build/package/_CPack_Packages

      - name: Verify CPack artifacts
        run: >-
          cmake
          -DARTIFACT_DIR=build/package
          -DEXPECTED_ARTIFACTS="copperfin-0.1.0-Darwin.pkg;copperfin-0.1.0-Darwin.tar.gz"
          -P tests/run_cpack_artifact_contract_check.cmake

      - name: Upload macOS installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copperfin-macos-installers
          path: |
            build/package/copperfin-0.1.0-Darwin.pkg
            build/package/copperfin-0.1.0-Darwin.tar.gz
          if-no-files-found: error

  linux-deb-rpm-installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install RPM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCOPPERFIN_BUILD_TESTS=OFF

      - name: Verify package documents
        run: cmake --build build --config Release --target copperfin_package_document_check

      - name: Build
        run: cmake --build build --target copperfin_studio_host copperfin_runtime_host copperfin_build_host copperfin_inspect

      - name: Package Debian, RedHat, and portable archives
        run: |
          cmake -E remove_directory build/package
          cmake -E make_directory build/package
          cpack --config build/CPackConfig.cmake -B build/package -G "DEB;RPM;TGZ"
          cmake -E remove_directory build/package/_CPack_Packages

      - name: Verify CPack artifacts
        run: >-
          cmake
          -DARTIFACT_DIR=build/package
          -DEXPECTED_ARTIFACTS="copperfin-0.1.0-Linux.deb;copperfin-0.1.0-Linux.rpm;copperfin-0.1.0-Linux.tar.gz"
          -P tests/run_cpack_artifact_contract_check.cmake

      - name: Upload Linux installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copperfin-linux-installers
          path: |
            build/package/copperfin-0.1.0-Linux.deb
            build/package/copperfin-0.1.0-Linux.rpm
            build/package/copperfin-0.1.0-Linux.tar.gz
          if-no-files-found: error
