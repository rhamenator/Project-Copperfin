name: Build Visual Studio VSIX
# Traceability: RQ-CF-REL-003; DQ-windows-vsix-lifecycle-scope;
# DV-windows-vsix-lifecycle-contract; HZ-system-failure-01;
# HZ-data-corruption-01; HZ-doc-command-01.

on:
  push:
    branches: [main]
    paths-ignore:
      - ".agent-channel/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".agent-channel/**"
      - "docs/**"
      - "**/*.md"
      - "**/*.txt"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vsix:
    # The shipping package is built with VSSDK 17.x. Keep this lifecycle lane
    # on the explicit VS2022 image; windows-latest moved to VS2026 in June 2026.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Restore and build VSIX
        run: msbuild vsix/Copperfin.VisualStudio/Copperfin.VisualStudio.csproj /restore /t:Rebuild /nodeReuse:false /p:Configuration=Release /p:DeployExtension=false

      - name: Exercise Windows VSIX lifecycle
        shell: pwsh
        run: |
          $vsix = @(Get-ChildItem -LiteralPath 'vsix/Copperfin.VisualStudio/bin/Release/net472' -Filter '*.vsix' -File)
          if ($vsix.Count -ne 1) {
            throw "Expected exactly one VSIX artifact, found $($vsix.Count)."
          }
          ./scripts/test-windows-vsix-lifecycle.ps1 `
            -VsixPath $vsix[0].FullName `
            -EvidenceDirectory (Join-Path $env:RUNNER_TEMP "copperfin-vsix-lifecycle-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")

      - name: Verify localized command resources
        shell: pwsh
        run: ./scripts/test-vsix-command-localization.ps1 -VsixPath vsix/Copperfin.VisualStudio/bin/Release/net472/Copperfin.VisualStudio.vsix

      - name: Run managed VSIX behavior tests
        run: dotnet run --project vsix/Copperfin.LanguageServiceTests/Copperfin.StudioTargetSelectionTests.csproj --configuration Release

      - name: Run managed language-service tests
        run: dotnet run --project vsix/Copperfin.LanguageServiceTests/Copperfin.LanguageServiceTests.csproj --configuration Release

      - name: Run .NET Framework process-runner tests
        run: dotnet run --project vsix/Copperfin.ProcessRunnerNetFrameworkTests/Copperfin.ProcessRunnerNetFrameworkTests.csproj --configuration Release

      - name: Stage Windows VSIX lifecycle evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $sourceDirectory = Join-Path $env:RUNNER_TEMP "copperfin-vsix-lifecycle-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path 'artifacts/windows-vsix-lifecycle' -Force | Out-Null
          if (Test-Path -LiteralPath $sourceDirectory -PathType Container) {
            Get-ChildItem -LiteralPath $sourceDirectory -File |
              Where-Object { $_.Name -in @('windows-vsix-lifecycle.json', 'ActivityLog.xml', 'ActivityLog-registration.xml', 'ui-automation-command.json', 'ui-automation-prg.json') } |
              Copy-Item -Destination 'artifacts/windows-vsix-lifecycle'
          }

      - name: Upload Windows VSIX lifecycle diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copperfin-windows-vsix-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/windows-vsix-lifecycle/
          if-no-files-found: warn

      - name: Create exact Corresponding Source archive
        uses: ./.github/actions/create-release-source
        with:
          revision: ${{ github.sha }}

      - name: Upload VSIX artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copperfin-visualstudio-vsix
          path: |
            vsix/Copperfin.VisualStudio/bin/Release/net472/*.vsix
            artifacts/windows-vsix-lifecycle/windows-vsix-lifecycle.json
            release-source/Project-Copperfin-source-${{ github.sha }}.zip
          if-no-files-found: error
